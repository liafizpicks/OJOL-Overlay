<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OJOL LIVE MAP</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
}

.info {
    position: absolute;
    z-index: 9999;
    top: 10px;
    left: 10px;

    background: rgba(0,0,0,.78);
    color: white;

    padding: 8px 12px;
    border-radius: 12px;

    font-family: Arial, sans-serif;
    font-size: 12px;
}

.status {
    color: #00e676;
    font-weight: bold;
}

#speed {
    margin-top: 3px;
    opacity: .85;
}

.motor-icon {
    font-size: 30px;
    filter:
        drop-shadow(0 2px 3px rgba(0,0,0,.7));
}
</style>
</head>

<body>

<div id="map"></div>

<div class="info">
    <div class="status">● LIVE GPS</div>
    <div id="speed">Mencari posisi...</div>
</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

let map;
let marker;
let firstLocation = true;

function initMap(lat, lon) {

    map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([lat, lon], 16);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19
        }
    ).addTo(map);

    const motor = L.divIcon({
        className: '',
        html: '<div class="motor-icon">🛵</div>',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    marker = L.marker(
        [lat, lon],
        { icon: motor }
    ).addTo(map);
}

function updateGPS(position) {

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    let speed = position.coords.speed;

    if (speed === null) {
        speed = 0;
    }

    speed = speed * 3.6;

    document.getElementById("speed").innerHTML =
        "🛵 " + speed.toFixed(0) + " km/h";

    if (!map) {

        initMap(lat, lon);

        return;
    }

    marker.setLatLng([lat, lon]);

    if (firstLocation) {

        map.setView(
            [lat, lon],
            16
        );

        firstLocation = false;
    }
}

function gpsError(error) {

    document.getElementById("speed").innerHTML =
        "⚠️ GPS belum tersedia";

    console.log(error);
}

if ("geolocation" in navigator) {

    navigator.geolocation.watchPosition(
        updateGPS,
        gpsError,
        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
        }
    );

} else {

    document.getElementById("speed").innerHTML =
        "GPS tidak didukung";
}

</script>

</body>
</html>
